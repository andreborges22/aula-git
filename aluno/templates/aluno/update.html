<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Módulo Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>    
    <h1>Edição de Alunos</h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
<body>
    {% for message in messages %}
        <div class = "alert alert-primary" role="alert">                    
            {{ message }}
        </div>                
    {% endfor %} 
    <form action="{% url 'atualizar' aluno.id %}" method="post" class="form-control">
        {% csrf_token %} 
        <br>
        <label>Nome</label>
        <br>
        <input type="text" id="nome" name="nome" value="{{aluno.nome}}" required>
        <br>
        <label>Email</label>
        <br>
        <input type="email" id="email" name="email" value="{{aluno.email}}" placeholder="Digite um email válido" required>
        <br>        
        <label>Curso</label>
        <br> 
        <select id = "curso" name="curso">

            <option value="">Selecione um curso</option>

            {% for curso in cursos %}
                <option value="{{ curso.id }}" {% if curso == aluno.curso %}selected{% endif %}>
                    {{ curso.nome }}
                </option>
            {% endfor %}

        </select>
        <br> 
        <br>
        <button type="submit" value="Cadastrar Aluno" class="btn btn-success">Editar</button>        
    </form>
</body>
