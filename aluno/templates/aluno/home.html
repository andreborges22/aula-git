<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Módulo Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Home Aluno</h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
<body>   
    {% for message in messages %}
        <div class = "alert alert-primary" role="alert">                    
            {{ message }}
        </div>                
    {% endfor %} 
    <form action="{% url 'cadastrar' %}" method="post" class="form-control">
        {% csrf_token %} 
        <br>
        <label>Nome</label>
        <br>
        <input type="text" id="nome" name="nome" value="" required>
        <br>
        <label>Email</label>
        <br>
        <input type="email" id="email" name="email" value="" placeholder="Digite um email válido" required>        
        <br> 
        <br> 
        <button type="submit" value="Cadastrar Aluno" class="btn btn-success">Cadastrar</button>        
    </form>
    <hr>
     <h1>Lista de Alunos</h1>
     <hr>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Email</th>
                    <th scope="col">Curso</th>
                    <th scope="col">Editar</th>
                    <th escope = "col">Deletar</th>
                </tr>
            </thead>    
            <tbody>
                <tr>
                    {% for aluno in alunos %}                
                        <tr>
                            <td>{{aluno.id}}</td>
                            <td>{{aluno.nome}}</td>     
                            <td>{{aluno.email}}</td>   
                            <td>{{aluno.curso}}</td>                               
                            <td><a href="{% url  'editar' aluno.id %}"><button class="btn btn-link">Editar</button></a></td>
                            <td><a href="{% url  'deletar' aluno.id %}"><button class="btn btn-danger">Deletar</button></a></td>
                        </tr>                
                </tr>
                    {% endfor %}
            </tbody>
        </table>
</body>
</html>
