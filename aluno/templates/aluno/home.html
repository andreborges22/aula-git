<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Home Aluno</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>      
</head>
<body>    
    <form action="{% url 'cadastrar' %}" method="post" class="form-control">
        {% csrf_token %} 
        <label>Nome</label>
        <input type="text" id="nome" name="nome" value="">
        <br>
        <button type="submit" value="Cadastrar Aluno" class="btn btn-success">Cadastrar</button>        
    </form>
    <hr>
     <h1>Lista de Alunos</h1>
    {% for aluno in alunos %}
        {{aluno.nome}}
    {% endfor %}
</body>
</html>
